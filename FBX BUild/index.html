<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-eval' 'unsafe-inline' https://unpkg.com blob:;
        connect-src 'self';
        media-src 'self';
        style-src 'self';
        img-src 'self' data: https: blob:;
        object-src 'none';
        form-action 'none';
      "
    />

    <title>My project</title>
    <link rel="shortcut icon" href="TemplateData/SOLEIL-logo.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  </head>

  <body>
    <div id="unity-page">
      <div id="unity-container">
        <canvas id="unity-canvas" width="1920" height="1080"></canvas>
      </div>
    </div>

    <div id="loading-overlay">
      <div id="loading-wrapper">
        <lottie-player
          id="loadingBar"
          src="StreamingAssets/loadingBar.json"
          background="transparent"
          speed="1"
          loop
          autoplay
        ></lottie-player>
      </div>
    </div>

    <button id="fullscreen-btn" aria-label="Enter fullscreen">⛶</button>

    <script src="Build/FBX BUild.loader.js"></script>
    <script src="main.js"></script>
  </body>
</html>
