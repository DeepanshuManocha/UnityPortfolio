<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:;
        connect-src 'self';
        media-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https: blob:;
        object-src 'none';
        form-action 'none';
      "
    />

    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/logo.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
  </head>

  <body>
    <div id="unity-page">
      <div id="unity-container">
        <canvas id="unity-canvas" width="1920" height="1080"></canvas>
      </div>
    </div>

    <!-- Loading screen -->
    <div id="loading">
      <div class="loading-inner">
        <p class="loading-kicker">Portfolio of</p>
        <img class="loading-logo" src="TemplateData/logo.ico" alt="Deepanshu Manocha" />
        <p class="loading-role">Game Developer · XR Builder</p>
        <div class="loading-bar"><span id="loadingFill"></span></div>
        <p id="loadingTip" class="loading-tip">Loading the room…</p>
      </div>
    </div>

    <button id="fullscreen-btn" aria-label="Enter fullscreen">⛶</button>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script src="main.js"></script>
  </body>
</html>
